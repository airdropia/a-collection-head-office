[package]
name = "a-collection-head-office"
version = "0.45.1"
description = "Local-first AI-assisted business OS"
edition = "2021"

# v0.35.0: Library target — both binaries (Tauri GUI + acollectionho write-CLI)
# share the same business/command layer (single source of truth).
[lib]
name = "a_collection_head_office_lib"
path = "src/lib.rs"

[[bin]]
name = "a-collection-head-office"
path = "src/main.rs"

[[bin]]
name = "acollectionho"
path = "src/bin/acollectionho.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-shell = "2.4.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
# v0.14.5: Clipboard manager for sharing product images to social platforms.
# Browser/Tauri-Web APIs can auto-attach text to share URLs (wa.me, FB
# sharer, etc.) but cannot attach images. We work around this by writing
# the product image to the system clipboard (writeImage) so the user can
# Ctrl+V paste it directly into Facebook/WhatsApp/Instagram post composers.
tauri-plugin-clipboard-manager = "2.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
chrono = { version = "0.4.38", features = ["serde"] }
tokio = { version = "1.38.0", features = ["full"] }
reqwest = { version = "0.12.5", features = ["json", "multipart"] }
image = "0.25.1"
csv = "1.3.0"
dirs = "5.0.1"
base64 = "0.22.1"
rqrr = "0.5"
ocrs = "0.6"
rten-tensor = "0.8"
scraper = "0.19"
urlencoding = "2.1"
zip = "2.1"
