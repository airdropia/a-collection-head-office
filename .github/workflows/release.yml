name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.34.0). Leave empty to manually dispatch.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # v0.14.4: Verify that the Cargo.toml version matches the pushed tag.
      # A mismatch means the binary reports one version (e.g. 0.14.3) while
      # the GitHub Release says another (e.g. v0.14.4) — confusing for users
      # downloading the installer. Fails fast before wasting build minutes.
      - name: Verify version matches tag
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*= "\(.*\)".*/\1/')
          # Manual dispatch (workflow_dispatch) sets GITHUB_REF_NAME to branch name (master),
          # which is not a version. Only compare when triggered by a tag push.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Cargo.toml version: $CARGO_VERSION"
            echo "Tag version:         $TAG_VERSION"
            if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch — Cargo.toml=$CARGO_VERSION but tag=$TAG_VERSION. Bump all 3 files (Cargo.toml, tauri.conf.json, package.json) before tagging."
              exit 1
            fi
            echo "Version check passed."
          else
            echo "Manual dispatch — skipping tag version comparison."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Windows)
        run: npx tauri build --bundles nsis,msi

      # v0.35.0: the write-CLI binary builds as a second [[bin]] target of the
      # same crate — `npx tauri build` compiles it via `cargo build --release`
      # alongside the GUI app. Attach the standalone exe to the release so
      # pi-agent / owner can download it without building locally.
      - name: Collect write-CLI binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-cli | Out-Null
          Copy-Item src-tauri/target/release/acollectionho.exe dist-cli/acollectionho-${{ github.ref_name }}.exe -ErrorAction Stop
          Get-ChildItem dist-cli

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload write-CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-write-cli
          path: dist-cli/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            dist-cli/*.exe
          generate_release_notes: true
